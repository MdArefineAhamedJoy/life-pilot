services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: life-os-ai
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:4000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
